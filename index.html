<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Монолит - Управление данными</title>
    <!-- Подключаем шрифты и иконки -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* Светлая тема (по умолчанию) */
            --bg-body: #f4f5fa;
            --bg-header: #ffffff;
            --bg-card: #ffffff;
            --bg-form: #f0fdf4;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --primary: #00a676;
            --primary-hover: #008c63;
            --input-bg: #ffffff;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --duplicate-bg: #fef2f2;
            --duplicate-border: #f87171;
            --duplicate-text: #dc2626;
            --logo-color: #6366f1;
        }

        [data-theme="dark"] {
            /* Темная тема */
            --bg-body: #0f172a;
            --bg-header: #1e293b;
            --bg-card: #1e293b;
            --bg-form: #132b24;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --primary: #10b981;
            --primary-hover: #059669;
            --input-bg: #0f172a;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            --duplicate-bg: #450a0a;
            --duplicate-border: #ef4444;
            --duplicate-text: #fca5a5;
            --logo-color: #818cf8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            transition: background-color 0.3s, color 0.3s;
            min-height: 100vh;
        }

        /* Header */
        header {
            background-color: var(--bg-header);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-icon {
            background-color: var(--logo-color);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        /* --- НЕОНОВАЯ АНИМАЦИЯ ДЛЯ ТЕКСТА --- */
        .logo-text {
            display: flex;
            flex-direction: column;
            justify-content: center;
            filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.3));
        }

        .logo-text h1 {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 1.5px;
            background: linear-gradient(90deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: neon-text-anim 4s linear infinite;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .logo-text p {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: neon-text-anim 4s linear infinite reverse;
        }

        @keyframes neon-text-anim {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .secure-badge {
            background-color: var(--bg-body);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }

        .secure-dot {
            width: 8px;
            height: 8px;
            background: linear-gradient(135deg, #fbbf24, #10b981);
            border-radius: 50%;
        }

        .theme-toggle {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 20px;
            cursor: pointer;
            transition: color 0.2s;
        }
        .theme-toggle:hover { color: var(--text-main); }

        /* ===== RADIO PLAYER ===== */
        .radio-player {
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: var(--bg-body);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 6px 14px;
            min-width: 280px;
            transition: border-color 0.2s;
        }
        .radio-player:hover { border-color: var(--primary); }

        .radio-play-btn {
            background: var(--primary);
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            font-size: 12px;
            transition: background-color 0.2s, transform 0.1s;
        }
        .radio-play-btn:hover { background-color: var(--primary-hover); transform: scale(1.08); }
        .radio-play-btn.loading {
            animation: radio-spin 1s linear infinite;
        }
        @keyframes radio-spin {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        .radio-nav-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 13px;
            padding: 2px 4px;
            flex-shrink: 0;
            transition: color 0.2s;
            line-height: 1;
        }
        .radio-nav-btn:hover { color: var(--primary); }

        .radio-info {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0;
            cursor: pointer;
        }
        .radio-station-name {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.3;
        }
        .radio-status {
            font-size: 10px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 4px;
            line-height: 1.3;
        }
        .radio-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-muted);
            flex-shrink: 0;
            transition: background 0.3s;
        }
        .radio-dot.live { background: #ef4444; animation: radio-pulse-dot 1.2s ease-in-out infinite; }
        @keyframes radio-pulse-dot {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.3; }
        }

        .radio-volume {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
        }
        .radio-volume i { font-size: 11px; color: var(--text-muted); }
        .radio-volume-slider {
            -webkit-appearance: none;
            width: 54px;
            height: 3px;
            background: var(--border-color);
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }
        .radio-volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            background: var(--primary);
            border-radius: 50%;
            cursor: pointer;
        }

        /* Dropdown list of stations */
        .radio-stations-dropdown {
            display: none;
            position: absolute;
            top: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            z-index: 1000;
            min-width: 220px;
            overflow: hidden;
            animation: fadeIn 0.15s ease-out;
        }
        .radio-stations-dropdown.open { display: block; }
        .radio-station-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-main);
            transition: background 0.15s;
        }
        .radio-station-item:hover { background: var(--bg-body); }
        .radio-station-item.active {
            background: var(--bg-form);
            color: var(--primary);
            font-weight: 700;
        }
        .radio-station-item i {
            font-size: 11px;
            color: var(--text-muted);
            width: 14px;
        }
        .radio-station-item.active i { color: var(--primary); }
        .radio-player-wrap {
            position: relative;
        }

        /* Кнопка озвучки в шапке */
        .tts-toggle {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 20px;
            padding: 6px 14px;
            display: flex;
            align-items: center;
            gap: 7px;
            font-weight: 500;
        }
        .tts-toggle:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
        .tts-toggle.tts-on {
            background-color: var(--primary);
            border-color: var(--primary);
            color: white;
        }
        .tts-toggle.tts-off {
            background-color: var(--bg-body);
            border-color: var(--border-color);
            color: var(--text-muted);
            opacity: 0.7;
        }

        /* Main Content */
        main {
            padding: 30px 40px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* --- НЕОНОВЫЕ РАЗДЕЛИТЕЛИ --- */
        .neon-divider-horizontal {
            position: relative;
            height: 3px;
            width: 100%;
            margin-bottom: 30px;
            border-radius: 3px;
            background: linear-gradient(90deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000);
            background-size: 200% 100%;
            animation: neon-line-h 3s linear infinite;
        }
        .neon-divider-horizontal::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: inherit;
            filter: blur(8px);
            opacity: 0.7;
            z-index: 0;
        }
        @keyframes neon-line-h {
            0% { background-position: 0% 0; }
            100% { background-position: 200% 0; }
        }

        .neon-divider-vertical {
            position: relative;
            width: 3px;
            height: 100%;
            border-radius: 3px;
            background: linear-gradient(180deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000);
            background-size: 100% 200%;
            animation: neon-line-v 3s linear infinite;
        }
        .neon-divider-vertical::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: inherit;
            filter: blur(8px);
            opacity: 0.7;
            z-index: 0;
        }
        @keyframes neon-line-v {
            0% { background-position: 0 0%; }
            100% { background-position: 0 200%; }
        }

        /* Form Section */
        .form-section {
            background-color: var(--bg-form);
            border-radius: 16px;
            padding: 25px 30px;
            margin-bottom: 30px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        .form-title {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--primary);
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .inputs-row {
            display: flex;
            gap: 15px;
            align-items: flex-end;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
            min-width: 200px;
        }

        .input-group label {
            font-size: 11px;
            font-weight: 600;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 15px;
            color: var(--primary);
            font-size: 14px;
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px 15px 12px 40px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--input-bg);
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, background-color 0.2s, color 0.2s;
        }
        
        select { padding-left: 15px; }

        input[type="text"]:focus, select:focus {
            border-color: var(--primary);
        }

        /* Стили для дубликата в поле ввода */
        input[type="text"].input-duplicate {
            border-color: var(--duplicate-border);
            color: var(--duplicate-text);
            background-color: var(--duplicate-bg);
            font-weight: 600;
        }
        input[type="text"].input-duplicate:focus {
            border-color: var(--duplicate-text);
        }
        .input-wrapper.is-duplicate i {
            color: var(--duplicate-border);
        }

        .actions-group {
            display: flex;
            gap: 10px;
            align-items: stretch;
            height: 43px;
        }

        .btn-add {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0 25px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background-color 0.2s;
        }

        .btn-add:hover { background-color: var(--primary-hover); }

        .btn-mic {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 8px;
            width: 43px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn-mic:hover { border-color: var(--primary); color: var(--primary); }
        .btn-mic.recording {
            background-color: #fee2e2;
            border-color: #ef4444;
            color: #ef4444;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .search-bar {
            position: relative;
            max-width: 500px;
        }
        
        .search-bar input {
            border-radius: 20px;
            padding-left: 40px;
        }
        .search-bar i {
            color: var(--text-muted);
        }

        /* Quick Replies Buttons */
        .quick-replies {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }

        /* Базовый стиль переливающейся кнопки */
        .quick-reply-btn {
            border: none;
            color: #fff;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            background-size: 200% 100%;
            background-position: 0% 50%;
            transition: background-position 0.4s ease, transform 0.15s ease, box-shadow 0.2s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            letter-spacing: 0.2px;
        }
        .quick-reply-btn:hover {
            background-position: 100% 50%;
            transform: translateY(-2px) scale(1.04);
            box-shadow: 0 5px 16px rgba(0,0,0,0.22);
        }
        .quick-reply-btn:active {
            transform: translateY(0) scale(0.98);
        }

        /* Анимация переливания цвета */
        @keyframes qr-shimmer {
            0%   { background-position: 0%   50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0%   50%; }
        }

        /* Индивидуальные цвета */
        .qr-red {
            background-image: linear-gradient(90deg, #ff416c, #ff4b2b, #ff6e6e, #ff416c);
            animation: qr-shimmer 3.5s ease infinite;
        }
        .qr-orange {
            background-image: linear-gradient(90deg, #f7971e, #ffd200, #f7971e, #ffa502);
            animation: qr-shimmer 3.8s ease infinite;
        }
        .qr-yellow {
            background-image: linear-gradient(90deg, #f9d423, #f83600, #f9d423, #fc913a);
            animation: qr-shimmer 4s ease infinite;
        }
        .qr-lime {
            background-image: linear-gradient(90deg, #56ab2f, #a8e063, #56ab2f, #78e08f);
            animation: qr-shimmer 3.6s ease infinite;
        }
        .qr-teal {
            background-image: linear-gradient(90deg, #11998e, #38ef7d, #11998e, #2af598);
            animation: qr-shimmer 3.4s ease infinite;
        }
        .qr-purple {
            background-image: linear-gradient(90deg, #8e2de2, #4a00e0, #8e2de2, #bc4cf7);
            animation: qr-shimmer 3.7s ease infinite;
        }
        .qr-blue {
            background-image: linear-gradient(90deg, #2980b9, #6dd5fa, #2980b9, #2193b0);
            animation: qr-shimmer 3.9s ease infinite;
        }
        .qr-pink {
            background-image: linear-gradient(90deg, #f953c6, #b91d73, #f953c6, #ee0979);
            animation: qr-shimmer 3.5s ease infinite;
        }
        .qr-coral {
            background-image: linear-gradient(90deg, #e96c4c, #ff9a44, #e96c4c, #fc6076);
            animation: qr-shimmer 4.1s ease infinite;
        }

        /* Кнопка «Многоканальный» */
        .quick-reply-btn.multichannel-btn {
            background-image: linear-gradient(90deg, #1a6fff, #45caff, #1a6fff, #00b4db);
            background-size: 200% 100%;
            animation: qr-shimmer 3.2s ease infinite;
            border: none;
            color: white;
            font-weight: 700;
        }
        .quick-reply-btn.multichannel-btn:hover {
            box-shadow: 0 5px 20px rgba(69,202,255,0.45);
        }

        /* Алерт о дубликате */
        .duplicate-alert {
            display: none;
            background-color: var(--duplicate-bg);
            color: var(--duplicate-text);
            border: 1px solid var(--duplicate-border);
            padding: 12px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 600;
            font-size: 14px;
            text-align: center;
            box-shadow: var(--shadow);
        }
        .duplicate-alert.show {
            display: block;
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Columns Section */
        .columns-container {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 20px;
            align-items: stretch;
        }

        .column {
            background-color: var(--bg-card);
            border-radius: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            min-height: 500px;
            display: flex;
            flex-direction: column;
        }

        .column-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .column-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
            font-weight: 600;
        }

        .col-indicator {
            width: 4px;
            height: 18px;
            border-radius: 2px;
        }
        .col-client .col-indicator { background-color: #ef4444; }
        .col-feed .col-indicator { background-color: #10b981; }

        .column-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .clear-col-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 15px;
            opacity: 0.6;
            transition: all 0.2s;
        }

        .clear-col-btn:hover {
            color: #ef4444;
            opacity: 1;
        }

        .counter {
            background-color: var(--bg-body);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .items-list {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
            flex-grow: 1;
        }

        /* Data Item / Card */
        .data-item {
            background-color: var(--bg-body);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
            transition: all 0.2s;
        }

        /* Duplicate Highlight */
        .data-item.duplicate {
            background-color: var(--duplicate-bg);
            border-color: var(--duplicate-border);
            box-shadow: 0 0 0 1px var(--duplicate-border);
        }
        .data-item.duplicate .item-phone {
            color: var(--duplicate-text);
            font-weight: 700;
        }

        .item-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .item-phone {
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .item-text {
            font-size: 14px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
            word-break: break-word;
        }

        .data-item.duplicate .item-text {
            color: var(--duplicate-text);
        }

        /* Edit Controls */
        .edit-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 12px;
            opacity: 0.5;
            transition: opacity 0.2s, color 0.2s;
        }
        .item-row:hover .edit-btn { opacity: 1; }
        .edit-btn:hover { color: var(--primary); }

        .delete-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            opacity: 0.5;
        }
        .delete-btn:hover { color: #ef4444; opacity: 1; }

        .inline-edit-input {
            border: 1px solid var(--primary);
            border-radius: 4px;
            padding: 2px 5px;
            font-size: inherit;
            font-family: inherit;
            background: var(--input-bg);
            color: var(--text-main);
            outline: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <div class="logo-icon"><i class="fas fa-database"></i></div>
            <div class="logo-text">
                <h1>МОНОЛИТ</h1>
                <p>Терминал управления данными</p>
            </div>
        </div>
        <!-- Радиоплеер в шапке -->
        <div class="radio-player-wrap">
            <div class="radio-player" id="radioPlayer">
                <button class="radio-nav-btn" id="radioPrev" title="Предыдущая станция">
                    <i class="fas fa-step-backward"></i>
                </button>
                <button class="radio-play-btn" id="radioPlayBtn" title="Воспроизвести / Пауза">
                    <i class="fas fa-play" id="radioPlayIcon"></i>
                </button>
                <button class="radio-nav-btn" id="radioNext" title="Следующая станция">
                    <i class="fas fa-step-forward"></i>
                </button>
                <div class="radio-info" id="radioInfo" title="Выбрать станцию">
                    <div class="radio-station-name" id="radioStationName">Русское Радио</div>
                    <div class="radio-status">
                        <div class="radio-dot" id="radioDot"></div>
                        <span id="radioStatusText">остановлено</span>
                    </div>
                </div>
                <div class="radio-volume">
                    <i class="fas fa-volume-down"></i>
                    <input type="range" class="radio-volume-slider" id="radioVolume" min="0" max="100" value="70">
                </div>
            </div>
            <!-- Выпадающий список станций -->
            <div class="radio-stations-dropdown" id="radioDropdown">
                <!-- Заполняется через JS -->
            </div>
        </div>

        <div class="header-right">
            <div class="secure-badge">
                <div class="secure-dot"></div>
                Защищенное соединение
            </div>
            <!-- Кнопка включения/выключения озвучки -->
            <button class="tts-toggle tts-on" id="ttsToggle" title="Включить/выключить озвучку дубликатов">
                <i class="fas fa-volume-up"></i>
                <span>Озвучка вкл</span>
            </button>
            <button class="theme-toggle" id="themeToggle" title="Сменить тему">
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </header>

    <main>
        <!-- Горизонтальная неоновая строка под шапкой -->
        <div class="neon-divider-horizontal"></div>

        <section class="form-section">
            <div class="form-title">
                <i class="fas fa-plus-circle"></i> Добавить новую запись
            </div>
            
            <div class="inputs-row">
                <div class="input-group">
                    <label>Номер телефона</label>
                    <div class="input-wrapper">
                        <i class="fas fa-phone-alt"></i>
                        <input type="text" id="phoneInput" placeholder="+7 (999) 000-00-00">
                    </div>
                </div>

                <div class="input-group" style="flex: 2;">
                    <label>Связанный текст / Описание</label>
                    <div class="input-wrapper">
                        <i class="fas fa-edit"></i>
                        <input type="text" id="textInput" placeholder="Введите комментарий...">
                    </div>
                </div>

                <div class="input-group">
                    <label>Колонка</label>
                    <select id="columnSelect">
                        <option value="client">Существующий клиент</option>
                        <option value="feed">ФИД</option>
                    </select>
                </div>

                <div class="actions-group">
                    <button class="btn-mic" id="micBtn" title="Голосовой ввод описания">
                        <i class="fas fa-microphone"></i>
                    </button>
                    <button class="btn-add" id="addBtn">
                        <i class="fas fa-plus"></i> ДОБАВИТЬ
                    </button>
                </div>
            </div>

            <div class="search-bar">
                <div class="input-wrapper">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Быстрый поиск по базе...">
                </div>
            </div>

            <!-- Кнопки быстрого ответа -->
            <div class="quick-replies">
                <button type="button" class="quick-reply-btn qr-red">Не дозвонился 1</button>
                <button type="button" class="quick-reply-btn qr-orange">Не дозвонился 2</button>
                <button type="button" class="quick-reply-btn qr-yellow">Не дозвонился 3</button>
                <button type="button" class="quick-reply-btn qr-lime">Не дозвонился 4</button>
                <!-- Кнопка «Многоканальный» -->
                <button type="button" class="quick-reply-btn multichannel-btn" id="multichannelBtn">
                    <i class="fas fa-layer-group" style="margin-right:5px;"></i>Многоканальный
                </button>
                <button type="button" class="quick-reply-btn qr-purple">Дал телефон менеджера</button>
                <button type="button" class="quick-reply-btn qr-blue">Ждёт звонок менеджера</button>
                <button type="button" class="quick-reply-btn qr-teal">Уже разговаривал с менеджером</button>
                <button type="button" class="quick-reply-btn qr-coral">Не дозвонился</button>
            </div>
        </section>

        <!-- Уведомление о дубликате -->
        <div class="duplicate-alert" id="duplicateAlert">
            <i class="fas fa-exclamation-triangle"></i> Найден дубликат в системе МОНОЛИТ
        </div>

        <!-- Горизонтальная неоновая строка над колонками -->
        <div class="neon-divider-horizontal" style="margin-bottom: 25px;"></div>

        <section class="columns-container">
            <!-- Левая колонка -->
            <div class="column col-client">
                <div class="column-header">
                    <div class="column-title">
                        <div class="col-indicator"></div>
                        Существующий клиент
                    </div>
                    <div class="column-actions">
                        <button class="clear-col-btn" onclick="clearColumn('client')" title="Очистить колонку">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                        <div class="counter" id="countClient">0</div>
                    </div>
                </div>
                <div class="items-list" id="listClient">
                    <!-- Сюда добавляются элементы -->
                </div>
            </div>

            <!-- Вертикальная неоновая бегущая строка между колонками -->
            <div class="neon-divider-vertical"></div>

            <!-- Правая колонка -->
            <div class="column col-feed">
                <div class="column-header">
                    <div class="column-title">
                        <div class="col-indicator"></div>
                        ФИД
                    </div>
                    <div class="column-actions">
                        <button class="clear-col-btn" onclick="clearColumn('feed')" title="Очистить колонку">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                        <div class="counter" id="countFeed">0</div>
                    </div>
                </div>
                <div class="items-list" id="listFeed">
                    <!-- Сюда добавляются элементы -->
                </div>
            </div>
        </section>
    </main>

    <script>
        // --- СОСТОЯНИЕ ПРИЛОЖЕНИЯ ---
        // Загружаем сохранённые записи из localStorage (если есть)
        let records = [];
        try {
            const saved = localStorage.getItem('monolit_records');
            if (saved) records = JSON.parse(saved);
        } catch(e) { records = []; }
        let searchQuery = '';

        // Сохраняем записи в localStorage при каждом изменении
        function saveRecords() {
            try { localStorage.setItem('monolit_records', JSON.stringify(records)); } catch(e) {}
        }

        // --- УПРАВЛЕНИЕ ОЗВУЧКОЙ ---
        let ttsEnabled = true;
        let lastSpokenPhone  = '';   // чтобы не зачитывать один и тот же номер несколько раз подряд (ввод)
        let lastSpokenSearch = '';   // чтобы не зачитывать одно и то же при поиске

        const ttsToggleBtn = document.getElementById('ttsToggle');

        ttsToggleBtn.addEventListener('click', () => {
            ttsEnabled = !ttsEnabled;
            if (ttsEnabled) {
                ttsToggleBtn.className = 'tts-toggle tts-on';
                ttsToggleBtn.innerHTML = '<i class="fas fa-volume-up"></i><span>Озвучка вкл</span>';
                // При включении сбрасываем последний озвученный номер
                lastSpokenPhone = '';
            } else {
                ttsToggleBtn.className = 'tts-toggle tts-off';
                ttsToggleBtn.innerHTML = '<i class="fas fa-volume-mute"></i><span>Озвучка выкл</span>';
                // Останавливаем текущее воспроизведение
                if (window.speechSynthesis) {
                    window.speechSynthesis.cancel();
                }
            }
        });

        function speakText(text) {
            if (!ttsEnabled) return;
            if (!window.speechSynthesis) return;
            if (!text || text === 'Нет описания') return;

            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ru-RU';
            utterance.rate = 0.95;
            utterance.pitch = 1;
            window.speechSynthesis.speak(utterance);
        }

        // --- DOM ЭЛЕМЕНТЫ ---
        const phoneInput = document.getElementById('phoneInput');
        const textInput = document.getElementById('textInput');
        const columnSelect = document.getElementById('columnSelect');
        const addBtn = document.getElementById('addBtn');
        const micBtn = document.getElementById('micBtn');
        const searchInput = document.getElementById('searchInput');
        const listClient = document.getElementById('listClient');
        const listFeed = document.getElementById('listFeed');
        const countClient = document.getElementById('countClient');
        const countFeed = document.getElementById('countFeed');
        const themeToggle = document.getElementById('themeToggle');
        const quickReplyBtns = document.querySelectorAll('.quick-reply-btn');
        const duplicateAlert = document.getElementById('duplicateAlert');
        const phoneInputWrapper = phoneInput.closest('.input-wrapper');

        // --- ИНИЦИАЛИЗАЦИЯ ТЕМЫ ---
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.body.setAttribute('data-theme', savedTheme);
        updateThemeIcon(savedTheme);

        themeToggle.addEventListener('click', () => {
            const currentTheme = document.body.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.body.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        });

        function updateThemeIcon(theme) {
            themeToggle.innerHTML = theme === 'light' ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
        }

        // --- БЫСТРЫЕ ОТВЕТЫ (КНОПКИ) ---
        quickReplyBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                textInput.value = btn.textContent.trim();
            });
        });

        // --- ГОЛОСОВОЙ ВВОД ---
        const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
        let isRecording = false;
        let recognition = null;

        // Создаём новый объект распознавания при каждом запуске — это исключает
        // ошибки «already started» и зависание после предыдущей сессии.
        function createRecognition() {
            const r = new SpeechRecognitionAPI();
            r.lang = 'ru-RU';
            r.interimResults = true;   // показываем текст по мере речи
            r.maxAlternatives = 1;
            r.continuous = false;

            r.onstart = () => {
                isRecording = true;
                micBtn.classList.add('recording');
                // Подсвечиваем поле описания во время записи
                textInput.style.borderColor = '#ef4444';
                textInput.placeholder = '🎤 Говорите…';
            };

            r.onresult = (event) => {
                // Собираем все промежуточные + финальные результаты
                let interim = '';
                let final  = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const t = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        final += t;
                    } else {
                        interim += t;
                    }
                }
                // Показываем финальный текст в поле; промежуточный — в placeholder
                if (final) {
                    textInput.value = textInput.value
                        ? textInput.value.trimEnd() + ' ' + final
                        : final;
                }
                if (interim) {
                    textInput.placeholder = '🎤 ' + interim;
                }
            };

            r.onend = () => {
                isRecording = false;
                micBtn.classList.remove('recording');
                textInput.style.borderColor = '';
                textInput.placeholder = 'Введите комментарий...';
                recognition = null;
            };

            r.onerror = (event) => {
                isRecording = false;
                micBtn.classList.remove('recording');
                textInput.style.borderColor = '';
                textInput.placeholder = 'Введите комментарий...';
                recognition = null;

                if (event.error === 'not-allowed') {
                    alert('Доступ к микрофону запрещён.\n\nРазрешите доступ: нажмите на значок замка/камеры в адресной строке браузера и выберите «Разрешить» для микрофона.');
                } else if (event.error === 'network') {
                    alert('Нет подключения к интернету. Голосовой ввод требует интернет (Google Speech API).');
                } else if (event.error !== 'no-speech' && event.error !== 'aborted') {
                    alert('Ошибка микрофона: ' + event.error);
                }
            };

            return r;
        }

        if (SpeechRecognitionAPI) {
            micBtn.addEventListener('click', (e) => {
                e.preventDefault();
                if (isRecording && recognition) {
                    recognition.stop();
                } else {
                    try {
                        recognition = createRecognition();
                        recognition.start();
                    } catch (err) {
                        isRecording = false;
                        micBtn.classList.remove('recording');
                        recognition = null;
                        console.error('Микрофон:', err);
                    }
                }
            });
        } else {
            micBtn.style.opacity = '0.4';
            micBtn.title = 'Голосовой ввод не поддерживается браузером';
            micBtn.addEventListener('click', (e) => {
                e.preventDefault();
                alert('Голосовой ввод недоступен.\n\nИспользуйте Google Chrome, Yandex Browser или Microsoft Edge.');
            });
        }

        // --- ЛОГИКА ДОБАВЛЕНИЯ ЗАПИСИ ---
        addBtn.addEventListener('click', () => {
            const phone = phoneInput.value.trim();
            const text = textInput.value.trim();
            const column = columnSelect.value;

            if (!phone) {
                alert('Пожалуйста, введите номер телефона');
                return;
            }

            const newRecord = {
                id: Date.now().toString(),
                phone: phone,
                text: text || 'Нет описания',
                column: column
            };

            records.push(newRecord);
            saveRecords();
            
            // Очистка полей
            phoneInput.value = '';
            textInput.value = '';

            // Сбрасываем последний озвученный номер при добавлении
            lastSpokenPhone = '';
            
            render();
        });

        // --- ПОИСК И ПРОВЕРКА В РЕАЛЬНОМ ВРЕМЕНИ ---
        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value.toLowerCase().trim();
            render();
        });

        // Проверка номера прямо во время ввода
        phoneInput.addEventListener('input', () => {
            render();
        });

        // --- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ---
        function cleanPhone(phoneStr) {
            return phoneStr.replace(/[^0-9+]/g, '');
        }

        // Удаление одной записи (по крестику на карточке)
        window.deleteRecord = function(id) {
            records = records.filter(r => r.id !== id);
            saveRecords();
            lastSpokenPhone = '';
            render();
        }

        // Удаление всех записей в конкретной колонке (по корзине в заголовке)
        window.clearColumn = function(columnName) {
            const confirmMsg = columnName === 'client' ? 'Существующий клиент' : 'ФИД';
            if (confirm(`Вы уверены, что хотите удалить ВСЕ записи из колонки "${confirmMsg}"?`)) {
                records = records.filter(r => r.column !== columnName);
                saveRecords();
                lastSpokenPhone = '';
                render();
            }
        }

        // --- РЕНДЕРИНГ И ПОИСК ДУБЛИКАТОВ ---
        function render() {
            listClient.innerHTML = '';
            listFeed.innerHTML = '';

            let clientCount = 0;
            let feedCount = 0;

            const currentInputPhone = cleanPhone(phoneInput.value);
            let isInputDuplicate = false;

            // 1. Подсчет частоты номеров в базе
            const phoneFrequency = {};
            records.forEach(r => {
                const clean = cleanPhone(r.phone);
                phoneFrequency[clean] = (phoneFrequency[clean] || 0) + 1;
            });

            // Проверяем, есть ли вводимый сейчас номер уже в базе
            if (currentInputPhone && phoneFrequency[currentInputPhone]) {
                isInputDuplicate = true;
            }

            // Управление стилями поля ввода и предупреждающей надписью
            if (isInputDuplicate) {
                phoneInput.classList.add('input-duplicate');
                phoneInputWrapper.classList.add('is-duplicate');
                duplicateAlert.classList.add('show');

                // --- ОЗВУЧКА ДУБЛИКАТА ---
                // Зачитываем текст найденных записей с таким номером (один раз при появлении)
                if (currentInputPhone !== lastSpokenPhone) {
                    lastSpokenPhone = currentInputPhone;
                    const matchingRecords = records.filter(r => cleanPhone(r.phone) === currentInputPhone);
                    if (matchingRecords.length > 0) {
                        const textsToSpeak = matchingRecords
                            .map(r => r.text)
                            .filter(t => t && t !== 'Нет описания')
                            .join('. ');
                        if (textsToSpeak) {
                            speakText(textsToSpeak);
                        }
                    }
                }
            } else {
                phoneInput.classList.remove('input-duplicate');
                phoneInputWrapper.classList.remove('is-duplicate');
                duplicateAlert.classList.remove('show');

                // Если номер больше не совпадает — сбрасываем, чтобы при повторном вводе снова озвучивалось
                if (lastSpokenPhone && lastSpokenPhone !== currentInputPhone) {
                    lastSpokenPhone = '';
                    if (window.speechSynthesis) {
                        window.speechSynthesis.cancel();
                    }
                }
            }

            // 2. Отрисовка карточек
            // Сначала помечаем каждую запись как дубликат или нет,
            // затем сортируем внутри каждой колонки: дубликаты — наверх.
            // Нормализованный запрос: только цифры (для поиска по номерам без форматирования)
            const cleanQuery = searchQuery.replace(/[^0-9]/g, '');

            const annotated = records
                .map(record => {
                    const rawPhone  = record.phone.toLowerCase();
                    const cleanRec  = cleanPhone(record.phone); // только цифры+«+»

                    // Совпадение по телефону:
                    // 1) сырая строка содержит запрос (например, скобки/дефисы совпадают)
                    // 2) очищенный номер содержит очищенный запрос (цифры без форматирования)
                    // 3) если начинается с «8», сравниваем и вариант с «7» в начале
                    let phoneMatch = rawPhone.includes(searchQuery);
                    if (!phoneMatch && cleanQuery.length >= 3) {
                        phoneMatch = cleanRec.includes(cleanQuery);
                    }
                    // нормализация 8→+7: 89161234567 ↔ 79161234567
                    if (!phoneMatch && cleanQuery.length >= 7) {
                        const alt = cleanQuery.startsWith('8')
                            ? '7' + cleanQuery.slice(1)
                            : cleanQuery.startsWith('7')
                                ? '8' + cleanQuery.slice(1)
                                : null;
                        if (alt) phoneMatch = cleanRec.includes(alt) || cleanRec.replace(/^\+/, '').includes(alt);
                    }

                    const textMatch = record.text.toLowerCase().includes(searchQuery);
                    if (searchQuery && !phoneMatch && !textMatch) return null;
                    const isSearchHighlight = searchQuery && phoneMatch;
                    const isDuplicate = phoneFrequency[cleanRec] > 1 ||
                                        (currentInputPhone && cleanRec === currentInputPhone) ||
                                        isSearchHighlight;
                    return { record, isDuplicate, isSearchHighlight };
                })
                .filter(Boolean);

            // --- ОЗВУЧКА ПРИ ПОИСКЕ ---
            // Если поисковая строка содержит совпадение по номеру телефона — зачитываем текст записей
            if (searchQuery) {
                const phoneHits = annotated.filter(a => a.isSearchHighlight);
                if (phoneHits.length > 0 && searchQuery !== lastSpokenSearch) {
                    lastSpokenSearch = searchQuery;
                    const textsToSpeak = phoneHits
                        .map(a => a.record.text)
                        .filter(t => t && t !== 'Нет описания')
                        .join('. ');
                    if (textsToSpeak) {
                        speakText(textsToSpeak);
                    }
                }
            } else {
                // Поиск очищен — сбрасываем, останавливаем озвучку поиска
                if (lastSpokenSearch) {
                    lastSpokenSearch = '';
                    if (window.speechSynthesis) window.speechSynthesis.cancel();
                }
            }

            // Стабильная сортировка: дубликаты выше, остальное в исходном порядке
            annotated.sort((a, b) => {
                if (a.isDuplicate === b.isDuplicate) return 0;
                return a.isDuplicate ? -1 : 1;
            });

            annotated.forEach(({ record, isDuplicate }) => {
                const itemEl = document.createElement('div');
                itemEl.className = `data-item ${isDuplicate ? 'duplicate' : ''}`;
                itemEl.innerHTML = `
                    <button class="delete-btn" onclick="deleteRecord('${record.id}')"><i class="fas fa-times"></i></button>
                    <div class="item-row">
                        <i class="fas fa-phone-alt" style="color: ${isDuplicate ? 'var(--duplicate-border)' : 'var(--primary)'}; font-size: 12px;"></i>
                        <span class="item-phone">
                            <span class="editable-val">${record.phone}</span>
                            <button class="edit-btn" onclick="startEdit(this, '${record.id}', 'phone')"><i class="fas fa-pencil-alt"></i></button>
                        </span>
                    </div>
                    <div class="item-row">
                        <i class="fas fa-comment-alt" style="color: var(--text-muted); font-size: 12px;"></i>
                        <span class="item-text">
                            <span class="editable-val">${record.text}</span>
                            <button class="edit-btn" onclick="startEdit(this, '${record.id}', 'text')"><i class="fas fa-pencil-alt"></i></button>
                        </span>
                    </div>
                `;

                if (record.column === 'client') {
                    listClient.appendChild(itemEl);
                    clientCount++;
                } else {
                    listFeed.appendChild(itemEl);
                    feedCount++;
                }
            });

            countClient.textContent = clientCount;
            countFeed.textContent = feedCount;
        }

        // --- РЕДАКТИРОВАНИЕ INLINE ---
        window.startEdit = function(btnElement, id, field) {
            const container = btnElement.parentElement;
            const valSpan = container.querySelector('.editable-val');
            const currentValue = valSpan.textContent;

            const input = document.createElement('input');
            input.type = 'text';
            input.value = currentValue;
            input.className = 'inline-edit-input';
            
            valSpan.style.display = 'none';
            btnElement.style.display = 'none';
            container.insertBefore(input, btnElement);
            input.focus();

            const save = () => {
                const newValue = input.value.trim();
                if (newValue) {
                    const record = records.find(r => r.id === id);
                    if (record) {
                        record[field] = newValue;
                        saveRecords();
                    }
                }
                render();
            };

            input.addEventListener('blur', save);
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    input.blur();
                }
            });
        };

        // Первоначальный рендер
        render();

        // ===================================================
        // РАДИОПЛЕЕР
        // ===================================================
        // Все потоки — MP3 128kbps (максимальная совместимость с браузерами)
        // Резервные URL подставляются автоматически если основной не работает
        const RADIO_STATIONS = [
            {
                name: 'Русское Радио',
                urls: [
                    'https://rusradio.hostingradio.ru/rusradio128.mp3',
                    'https://rusradio.hostingradio.ru/rusradio96.aacp',
                ],
                icon: 'fa-music'
            },
            {
                name: 'Хит FM',
                urls: [
                    'https://hitfm.hostingradio.ru/hitfm128.mp3',
                    'https://hitfm.hostingradio.ru/hitfm96.aacp',
                ],
                icon: 'fa-bolt'
            },
            {
                name: 'Монте-Карло',
                urls: [
                    'https://montecarlo.hostingradio.ru/montecarlo128.mp3',
                    'https://montecarlo.hostingradio.ru/montecarlo96.aacp',
                ],
                icon: 'fa-star'
            },
            {
                name: 'Наше Радио',
                urls: [
                    'https://nashe1.hostingradio.ru/nashe-128.mp3',
                    'https://nashe.hostingradio.ru/nashe96.aacp',
                ],
                icon: 'fa-guitar'
            },
            {
                name: 'Радио Maximum',
                urls: [
                    'https://maximum.hostingradio.ru/maximum128.mp3',
                    'https://maximum.hostingradio.ru/maximum96.aacp',
                ],
                icon: 'fa-fire'
            },
            {
                name: 'Европа Плюс',
                urls: [
                    'https://europaplus.hostingradio.ru/europaplus128.mp3',
                    'https://europaplus.hostingradio.ru/europaplus96.aacp',
                ],
                icon: 'fa-globe'
            },
            {
                name: 'Авторадио',
                urls: [
                    'https://avtoradio.hostingradio.ru/avtoradio128.mp3',
                    'https://avtoradio.hostingradio.ru/avtoradio96.aacp',
                ],
                icon: 'fa-car'
            },
            {
                name: 'Радио Дача',
                urls: [
                    'https://dacha.hostingradio.ru/dacha128.mp3',
                    'https://dacha.hostingradio.ru/dacha96.aacp',
                ],
                icon: 'fa-home'
            },
            {
                name: 'Ретро FM',
                urls: [
                    'https://retrofm.hostingradio.ru/retrofm128.mp3',
                    'https://retrofm.hostingradio.ru/retrofm96.aacp',
                ],
                icon: 'fa-clock'
            },
            {
                name: 'Радио Рекорд',
                urls: [
                    'https://record.hostingradio.ru/record128.mp3',
                    'https://record.hostingradio.ru/record96.aacp',
                ],
                icon: 'fa-record-vinyl'
            },
        ];

        let radioIndex    = 0;
        let radioPlaying  = false;
        let radioAudio    = new Audio();
        let radioUrlIndex = 0;   // индекс резервного URL для текущей станции
        radioAudio.volume = 0.7;

        const radioPlayBtn     = document.getElementById('radioPlayBtn');
        const radioPlayIcon    = document.getElementById('radioPlayIcon');
        const radioStationName = document.getElementById('radioStationName');
        const radioStatusText  = document.getElementById('radioStatusText');
        const radioDot         = document.getElementById('radioDot');
        const radioPrev        = document.getElementById('radioPrev');
        const radioNext        = document.getElementById('radioNext');
        const radioInfo        = document.getElementById('radioInfo');
        const radioDropdown    = document.getElementById('radioDropdown');
        const radioVolumeSlider = document.getElementById('radioVolume');

        // Построить список станций в dropdown
        function buildDropdown() {
            radioDropdown.innerHTML = '';
            RADIO_STATIONS.forEach((station, idx) => {
                const item = document.createElement('div');
                item.className = 'radio-station-item' + (idx === radioIndex ? ' active' : '');
                item.innerHTML = `<i class="fas ${station.icon}"></i>${station.name}`;
                item.addEventListener('click', (e) => {
                    e.stopPropagation();
                    selectStation(idx);
                    closeDropdown();
                });
                radioDropdown.appendChild(item);
            });
        }

        function openDropdown() {
            buildDropdown();
            radioDropdown.classList.add('open');
        }
        function closeDropdown() {
            radioDropdown.classList.remove('open');
        }

        // Закрывать dropdown при клике вне
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.radio-player-wrap')) {
                closeDropdown();
            }
        });

        radioInfo.addEventListener('click', (e) => {
            e.stopPropagation();
            radioDropdown.classList.contains('open') ? closeDropdown() : openDropdown();
        });

        function setRadioStatus(status) {
            // status: 'stopped' | 'loading' | 'playing' | 'error'
            if (status === 'playing') {
                radioPlayIcon.className = 'fas fa-pause';
                radioPlayBtn.classList.remove('loading');
                radioDot.className = 'radio-dot live';
                radioStatusText.textContent = '● эфир';
            } else if (status === 'loading') {
                radioPlayIcon.className = 'fas fa-circle-notch';
                radioPlayBtn.classList.add('loading');
                radioDot.className = 'radio-dot';
                radioStatusText.textContent = 'загрузка…';
            } else if (status === 'error') {
                radioPlayIcon.className = 'fas fa-play';
                radioPlayBtn.classList.remove('loading');
                radioDot.className = 'radio-dot';
                radioStatusText.textContent = 'ошибка соединения';
            } else {
                radioPlayIcon.className = 'fas fa-play';
                radioPlayBtn.classList.remove('loading');
                radioDot.className = 'radio-dot';
                radioStatusText.textContent = 'остановлено';
            }
        }

        function selectStation(idx) {
            radioIndex    = idx;
            radioUrlIndex = 0;
            radioStationName.textContent = RADIO_STATIONS[idx].name;
            if (radioPlaying) {
                startRadio();
            } else {
                setRadioStatus('stopped');
            }
        }

        function startRadio(urlIdx) {
            if (urlIdx === undefined) urlIdx = 0;
            radioUrlIndex = urlIdx;

            const station = RADIO_STATIONS[radioIndex];
            const urls    = station.urls;

            if (urlIdx >= urls.length) {
                // Все резервные URL исчерпаны
                radioPlaying = false;
                setRadioStatus('error');
                return;
            }

            radioAudio.pause();
            radioAudio = new Audio();
            radioAudio.volume = radioVolumeSlider.value / 100;
            radioAudio.preload = 'none';
            radioAudio.src     = urls[urlIdx];

            setRadioStatus('loading');

            radioAudio.addEventListener('playing', () => {
                radioPlaying = true;
                setRadioStatus('playing');
            }, { once: true });

            // При ошибке — пробуем следующий резервный URL
            radioAudio.addEventListener('error', () => {
                if (urlIdx + 1 < urls.length) {
                    startRadio(urlIdx + 1);
                } else {
                    radioPlaying = false;
                    setRadioStatus('error');
                }
            }, { once: true });

            radioAudio.play().catch(() => {
                if (urlIdx + 1 < urls.length) {
                    startRadio(urlIdx + 1);
                } else {
                    radioPlaying = false;
                    setRadioStatus('error');
                }
            });
        }

        function stopRadio() {
            radioAudio.pause();
            radioAudio.src = '';
            radioPlaying = false;
            setRadioStatus('stopped');
        }

        radioPlayBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (radioPlaying || radioStatusText.textContent === 'загрузка…') {
                stopRadio();
            } else {
                startRadio(0);
            }
        });

        radioPrev.addEventListener('click', (e) => {
            e.stopPropagation();
            radioIndex = (radioIndex - 1 + RADIO_STATIONS.length) % RADIO_STATIONS.length;
            radioStationName.textContent = RADIO_STATIONS[radioIndex].name;
            if (radioPlaying) startRadio();
            closeDropdown();
        });

        radioNext.addEventListener('click', (e) => {
            e.stopPropagation();
            radioIndex = (radioIndex + 1) % RADIO_STATIONS.length;
            radioStationName.textContent = RADIO_STATIONS[radioIndex].name;
            if (radioPlaying) startRadio();
            closeDropdown();
        });

        radioVolumeSlider.addEventListener('input', () => {
            radioAudio.volume = radioVolumeSlider.value / 100;
        });

    </script>
</body>
</html>
